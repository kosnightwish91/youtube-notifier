name: Periodic Stock News

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dotenv

      - name: Create environment file
        run: |
          printf 'STOCK_NEWS_BOT_TOKEN=%s\nSTOCK_NEWS_CHAT_ID=%s\n' \
            '${{ secrets.STOCK_NEWS_BOT_TOKEN }}' \
            '${{ secrets.STOCK_NEWS_CHAT_ID }}' > telebot.env

      - name: Run periodic stock news
        run: python periodic_stock_news.py

      - name: Commit and push updated state
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add stock_news_sent.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update stock news sent list"
          git push "https://${{ secrets.PUSH_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
